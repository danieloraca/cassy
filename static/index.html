<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#246944">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Cassy</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Raspberry Pi chat lab</p>
          <h1>Cassy</h1>
        </div>
        <div class="app-actions">
          <button id="install" class="quiet" type="button" hidden>Install</button>
          <button id="notifications" class="quiet" type="button">Notifications</button>
          <div class="connection" aria-live="polite">
            <span id="status-dot" class="status-dot"></span>
            <span id="status">Connecting</span>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="Chat identity">
        <label>
          <span>Conversation</span>
          <input id="conversation" value="demo" autocomplete="off">
        </label>
        <label>
          <span>Your name</span>
          <input id="sender" value="daniel" autocomplete="nickname">
        </label>
        <button id="join" type="button">Join</button>
      </section>

      <section id="messages" class="messages" aria-live="polite" aria-label="Messages">
        <p id="empty" class="empty">No messages yet. Say hello.</p>
      </section>

      <form id="composer" class="composer">
        <label class="sr-only" for="body">Message</label>
        <input id="body" placeholder="Write a message…" autocomplete="off" required maxlength="2000">
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </body>
</html>
